controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    simple_4wd_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    simple_4wd_diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

simple_4wd_diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["lf_wheel_joint", "lb_wheel_joint"]
    right_wheel_names: ["rf_wheel_joint", "rb_wheel_joint"]

    wheel_separation: 0.2
    wheel_radius: 0.05

    wheel_separation_multiplier: 1.0
    left_wheel_radius_multiplier: 1.0
    right_wheel_radius_multiplier: 1.0

    publish_rate: 50.0
    odom_frame_id: odom
    base_frame_id: base_link
    pose_covariance_diagonal : [0.001, 0.001, 0.0, 0.0, 0.0, 0.01]
    twist_covariance_diagonal: [0.001, 0.0, 0.0, 0.0, 0.0, 0.01]

    open_loop: true
    enable_odom_tf: true

    cmd_vel_timeout: 0.5
    use_stamped_vel: false
    
    # 直接设置命令话题
    command_interfaces:
      - velocity
    state_interfaces:
      - position
      - velocity
    
    # 速度和加速度限制
    linear.x.has_velocity_limits: true
    linear.x.has_acceleration_limits: true
    linear.x.max_velocity: 1.0
    linear.x.min_velocity: -1.0
    linear.x.max_acceleration: 2.0
    linear.x.min_acceleration: -2.0
    
    angular.z.has_velocity_limits: true
    angular.z.has_acceleration_limits: true
    angular.z.max_velocity: 3.0
    angular.z.min_velocity: -3.0
    angular.z.max_acceleration: 6.0
    angular.z.min_acceleration: -6.0
